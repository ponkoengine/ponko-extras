[workspace]
# Every plugin is a crate in crates/, made from the engine's plugin template
# (`ponko new crates/ponko_<thing> --plugin`); see README.md.
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/ponkoengine/ponko-extras"

[workspace.dependencies]
# The engine without its default features: a plugin never turns on a
# window, sound or a GPU for the games that use it. A crate that needs an
# engine feature names it in its own manifest:
#   ponko = { workspace = true, features = ["3d"] }
# The engine is a checkout beside this one (`../ponko`, on its main branch)
# until it is on crates.io; then this becomes `version = "0.1"`, and a new
# engine minor is a new minor of every crate here.
ponko = { path = "../ponko", default-features = false }
serde = { version = "1", features = ["derive"] }

# Quick tests while working on a plugin: the plugin with light
# optimization, the engine fully optimized. A game that uses a plugin
# builds it with the game's own profile; these settings don't reach it.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
